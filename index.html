<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Model Hub</title>
<meta name="description" content="Results from my prediction models, in one place.">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Model Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#eef0f3; --border:#dfe3e8;
  --text:#11161d; --text-2:#4b5563; --text-3:#6b7280;
  --accent:#1f6feb; --pos:#14804a; --neg:#c62828; --warn:#a15c00;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1116; --surface:#161b22; --surface-2:#1e252e; --border:#2a313b;
    --text:#e8ecf1; --text-2:#aab3bf; --text-3:#7d8794;
    --accent:#58a6ff; --pos:#3fb950; --neg:#f47067; --warn:#d29922;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px);
  min-height:100vh;
}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{
  position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 0 10px;margin-top:calc(-1 * env(safe-area-inset-top));
  border-bottom:1px solid var(--border);
}
header.top .wrap{display:flex;align-items:center;gap:10px}
header.top h1{font-size:20px;margin:0;flex:1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  border:1px solid var(--border);background:var(--surface);border-radius:10px;
  min-width:40px;height:40px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
}
.iconbtn:active{transform:scale(.97)}
.iconbtn svg{width:18px;height:18px}
.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sub{color:var(--text-3);font-size:13px;margin:12px 0 4px}
.grid{display:grid;gap:12px;margin-top:12px}
@media (min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.card{
  display:block;text-decoration:none;color:inherit;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 12px;
}
.card:active{background:var(--surface-2)}
.card .row1{display:flex;align-items:center;gap:8px}
.card h2{font-size:17px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sport{color:var(--text-3);font-size:13px;margin-top:2px}
.card .headline{margin-top:8px;color:var(--text-2);font-size:14px}
.card .meta{display:flex;gap:10px;margin-top:10px;font-size:12px;color:var(--text-3);align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pos);flex:none}
.dot.stale{background:var(--warn)}
.dot.old{background:var(--text-3)}
.badge{font-size:11px;border:1px solid var(--border);border-radius:999px;padding:1px 7px;color:var(--text-3);white-space:nowrap}
.badge.demo{color:var(--warn);border-color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:14px 0 4px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.stat .l{font-size:12px;color:var(--text-3)}
.stat .v{font-size:20px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.search{
  width:100%;margin:12px 0 4px;padding:11px 12px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font:inherit;font-size:16px;
}
.list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.item .t{display:flex;gap:8px;align-items:baseline}
.item .t b{flex:1;font-size:15px;min-width:0}
.item .edge{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.item .pick{margin-top:4px;font-size:15px;color:var(--accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;background:var(--surface-2);border-radius:8px;padding:3px 8px;color:var(--text-2);font-variant-numeric:tabular-nums}
.chip i{font-style:normal;color:var(--text-3);margin-right:4px}
.note{margin-top:8px;font-size:13px;color:var(--text-2)}
.empty{color:var(--text-3);text-align:center;padding:40px 10px}
.err{margin-top:14px;padding:12px;border-radius:12px;border:1px solid var(--neg);color:var(--neg);font-size:14px}
.foot{color:var(--text-3);font-size:12px;text-align:center;margin-top:28px}
.repbar{display:flex;gap:8px;margin:12px 0 8px;align-items:center}
.repsel{flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:16px;padding:0 10px}
.repbar a.iconbtn{text-decoration:none;color:var(--text);font-size:14px;margin-left:auto}
iframe.report{display:block;width:100%;height:calc(100vh - 170px);height:calc(100dvh - 170px);min-height:420px;border:1px solid var(--border);border-radius:12px;background:#fff}
.hide{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <button id="back" class="iconbtn hide" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="title">Model Hub</h1>
    <button id="refresh" class="iconbtn" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
</header>
<main class="wrap" id="view" aria-live="polite"></main>
<script src="app.js"></script>
</body>
</html>
