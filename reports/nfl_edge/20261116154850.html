return `<button class="${i===cur?'on':''}" data-i="${i}"><b>${g.away} @ ${g.home}</b><span class="edge ${c}">${sg(e)}</span><small>${g.away_qb.split(' ').pop()} v ${g.home_qb.split(' ').pop()} · ${g.home} ${sg(g.spread)}</small></button>`}).join('');
document.querySelectorAll('#rail button').forEach(el=>el.onclick=()=>show(+el.dataset.i))}
function kbox(g){const k=g.kalshi,b=k[k.best],t=k.best_team,c=b.ev>0.02?'var(--good)':b.ev<-0.02?'var(--warn)':'var(--ink)';
return `<div class="box" style="margin-bottom:14px"><h2>Kalshi</h2>
<div class="row"><span>${g.home} yes</span><b>${(k.home_bid*100).toFixed(0)}¢ bid / ${(k.home_ask*100).toFixed(0)}¢ ask</b></div>
<div class="row"><span>${g.away} yes</span><b>${(k.away_bid*100).toFixed(0)}¢ bid / ${(k.away_ask*100).toFixed(0)}¢ ask</b></div>
<div class="row" style="margin-top:8px"><span>Fair value (${Math.round((1-k.book_weight)*100)}% model, ${Math.round(k.book_weight*100)}% book)</span><b>${g.home} ${pct(k.fair_home)}</b></div>
<div class="row"><span>Best side</span><b style="color:${c}">Buy ${t} at ${(b.ask*100).toFixed(0)}¢ + ${(b.fee*100).toFixed(0)}¢ fee</b></div>
<div class="row"><span>Expected profit per contract</span><b style="color:${c}">${(b.ev*100).toFixed(1)}¢ (${(b.roi*100).toFixed(1)}% ROI)</b></div>
<div class="row"><span>Kelly / half-Kelly</span><b>${pct(b.kelly)} / ${pct(b.half_kelly)} of bankroll</b></div>
${k.volume!=null?`<p class="note">Volume ${k.volume.toLocaleString()} contracts. ${k.ticker}</p>`:''}
<p class="note">EV uses the ask plus Kalshi's taker fee. A positive number only means the blended fair value beats the price; if the model side of the blend is flagged below, weight the book more.</p></div>`}
function show(i){cur=i;const g=G[i],m=g.mc,fav=g.p_home>=.5?g.home:g.away,conf=g.p_home>=.5?g.p_home:1-g.p_home,e=g.margin-g.spread;
document.querySelectorAll('#rail button').forEach((b,j)=>b.classList.toggle('on',j===i));
document.querySelectorAll('#strip .g').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
const prof=g.profile.map(p=>{const av=p.away,hv=p.home,aw=(p.lower_better?av<hv:av>hv);
return `<tr><td>${p.label}</td><td class="${aw?'w':'l'}">${av}</td><td class="${aw?'l':'w'}">${hv}</td></tr>`}).join('');
const st=[['Pass EPA / play','pass_epa'],['Rush EPA / play','rush_epa'],['Success rate','sr'],['Offensive plays','plays'],['Turnovers','giveaways']].map(([l,k])=>`<tr><td>${l}</td><td>${g.stats[k][0]}</td><td>${g.stats[k][1]}</td></tr>`).join('');
const mx=Math.max(...m.hist),W=600,H=130;let bars='';m.hist.forEach((c,j)=>{const x=(j/m.hist.length)*W,w=W/m.hist.length-1,h=c/mx*(H-46),lo=m.edges[j],col=lo>=g.spread?'#E9B44C':'#5B6B7D';bars+=`<rect x="${x}" y="${H-20-h}" width="${w}" height="${h}" fill="${col}" rx="1"/>`});
const zx=(0-m.edges[0])/(m.edges[m.edges.length-1]-m.edges[0])*W,spx=(g.spread-m.edges[0])/(m.edges[m.edges.length-1]-m.edges[0])*W;
const hist=`<svg id="hist" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bars}<line x1="${zx}" y1="16" x2="${zx}" y2="${H-18}" stroke="#EDEFF2" stroke-dasharray="3 3"/><line x1="${spx}" y1="16" x2="${spx}" y2="${H-18}" stroke="#7FB7E8" stroke-width="2"/><text x="${zx}" y="11" fill="#EDEFF2" font-size="11" text-anchor="${zx<spx?"end":"start"}" dx="${zx<spx?-4:4}">tie</text><text x="${spx}" y="11" fill="#7FB7E8" font-size="11" text-anchor="${zx<spx?"start":"end"}" dx="${zx<spx?4:-4}">spread ${sg(g.spread)}</text><text x="4" y="${H-4}" fill="#8B97A6" font-size="11">${g.away} wins big</text><text x="${W-4}" y="${H-4}" fill="#8B97A6" font-size="11" text-anchor="end">${g.home} wins big</text></svg>`;
document.getElementById('detail').innerHTML=`
<div class="hero"><div class="team">${g.away}<small>${g.away_qb} · rest ${g.rest[0]}d</small></div>
<div class="big">${g.away_pts.toFixed(0)}<span>@</span>${g.home_pts.toFixed(0)}</div>
<div class="team r">${g.home}<small>${g.home_qb} · rest ${g.rest[1]}d</small></div></div>
<p class="sub" style="text-align:center">Projected score · ${g.date} · ${g.weather}${g.div?' · division game':''} · line ${g.home} ${sg(g.spread)}, total ${g.total_line}</p>
<div class="pv"><div class="box"><h2>Who wins</h2>
<div class="bar"><span class="mid"></span><i class="k" style="left:${g.market*100}%"></i><i class="m" style="left:${g.p_home*100}%"></i></div>
<div class="row"><span>${g.away}</span><span>${g.home}</span></div>
<div class="row" style="margin-top:8px"><span>Model <b class="mm">${pct(g.p_home)}</b> ${g.home}</span><span>Market <b class="kk">${pct(g.market)}</b> ${g.home}</span></div>
<div class="row"><span>Pick <b>${fav} ${pct(conf)}</b></span><span>Gap <b>${sg((g.p_home-g.market)*100,1)} pts</b></span></div>
<p class="note">Members: ${Object.entries(g.members).map(([k,v])=>k+' '+pct(v)).join(' · ')}</p></div>
<div class="box"><h2>Against the spread</h2>
<div class="row"><span>Model margin</span><b>${g.home} ${sg(g.margin)}</b></div>
<div class="row"><span>Closing spread</span><b>${g.home} ${sg(g.spread)}</b></div>
<div class="row"><span>Edge</span><b style="color:${Math.abs(e)>=3?(e>0?'var(--good)':'var(--warn)'):'var(--ink)'}">${sg(e)} pts ${Math.abs(e)>=3?'· past the 3-pt rule':'· inside noise'}</b></div>
<div class="row" style="margin-top:8px"><span>Projected total</span><b>${g.total.toFixed(1)} vs ${g.total_line}</b></div>
<div class="row"><span>${g.home} covers</span><b>${pct(m.home_cover)}</b></div>
<div class="row"><span>Over ${g.total_line}</span><b>${pct(m.over)}</b></div></div></div>
${g.kalshi?kbox(g):''}
${g.flags.length?`<div class="box flags"><h2>Watch</h2><ul>${g.flags.map(f=>`<li>${f}</li>`).join('')}</ul></div>`:''}
<div class="box" style="margin-top:14px"><h2>How the game goes (20,000 simulations)</h2>${hist}
<div class="mc"><div><span>${g.away} wins by 7+</span><b class="num">${pct(m.away_by7)}</b></div><div><span>One-score game</span><b class="num">${pct(m.one_score)}</b></div><div><span>${g.home} wins by 7+</span><b class="num">${pct(m.home_by7)}</b></div></div>
<p class="note">Margin percentiles 10 / 25 / 50 / 75 / 90: ${m.pct.map(x=>sg(x,0)).join(' / ')}. Amber bars are outcomes where ${g.home} covers.</p></div>
<div class="box" style="margin-top:14px"><h2>Matchup profile</h2><table><tr><th></th><th>${g.away}</th><th>${g.home}</th></tr>${prof}</table>
<p class="note">Rolling rates from each team's prior games. Brighter value is the better side of each line; defensive EPA and success rate are better when lower.</p></div>
<div class="box" style="margin-top:14px"><h2>Projected team stats</h2><table><tr><th></th><th>${g.away}</th><th>${g.home}</th></tr>${st}</table></div>`;
document.getElementById('detail').scrollTop=0}
strip();rail();show(0);
</script></body></html>
